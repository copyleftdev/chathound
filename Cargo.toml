[package]
name = "chathound"
version = "0.2.0"
edition = "2021"
description = "Polite, exhaustive tap of Kalshi live-market chat: adaptive polling that hears the whole venue without overwhelming it."
license = "MIT"
repository = "https://github.com/copyleftdev/chathound"
keywords = ["kalshi", "prediction-markets", "chat", "sentiment", "trading"]
categories = ["command-line-utilities", "finance"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

[profile.release]
lto = true
